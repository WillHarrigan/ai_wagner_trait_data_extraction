name: phyllotaxy_type
group: leaf_morphology
multi: true
description: The arrangement of leaves around the stem (words like pairs and leaflet information are important indicators).

values:
  - name: ALTERNATE
    label: Alternate
    definition: One leaf per node, arranged singly along the stem.
    synonyms: [alternate, spiral, spirally arranged]
  - name: OPPOSITE
    label: Opposite
    definition: Two leaves per node, positioned directly across from each other.
    synonyms: [opposite, in pairs, paired]
  - name: WHORLED
    label: Whorled
    definition: Three or more leaves arising from a single node in a ring.
    synonyms: [whorled, verticillate]
  - name: DECUSSATE
    label: Decussate
    definition: Opposite leaves with successive pairs at right angles to each other.
    synonyms: [decussate]
    parents: [OPPOSITE]
  - name: DISTICHOUS
    label: Distichous
    definition: Leaves arranged in two vertical ranks (two-ranked) on opposite sides of the stem.
    synonyms: [distichous, two-ranked, 2-ranked]
    parents: [ALTERNATE]
  - name: EQUITANT
    label: Equitant
    definition: Leaves folded lengthwise and overlapping in two ranks (as in iris).
    synonyms: [equitant]
  - name: TERNATE
    label: Ternate
    definition: Three leaves or leaflets arising from one node or point.
    synonyms: [ternate, in threes]
  - name: CAULINE
    label: Cauline
    definition: Leaves borne on the aerial stem (as opposed to basal).
    synonyms: [cauline, stem leaves]
