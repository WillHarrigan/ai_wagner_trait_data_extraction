name: leaf_shape_type
group: leaf_morphology
multi: true
description: Shape of leaf blade (ovate, lanceolate, cordate, etc.)

# parents express a shallow hierarchy: "ob-" forms point at their base form,
# and several broad outlines (e.g. OVATE, ELLIPTIC) act as parent terms.
# Synonyms capture adjectival / descriptive phrasings found in Wagner OCR text.

values:
  - name: ACEROSE
    label: Acerose
    definition: Needle-shaped; slender, stiff, and sharply pointed.
    synonyms: [needle-shaped, needle-like, acicular]
  - name: AWL_SHAPED
    label: Awl-shaped
    definition: Narrow and tapering to a fine, sharp point from a wider base.
    synonyms: [awl-shaped, subulate-like, tapering]
  - name: GLADIATE
    label: Gladiate
    definition: Sword-shaped; long, flat, and tapering, like a gladiator's sword.
    synonyms: [sword-shaped]
  - name: HASTATE
    label: Hastate
    definition: Spear-shaped, with two basal lobes pointing outward (halberd-like).
    synonyms: [spear-shaped, halberd-shaped]
  - name: CORDATE
    label: Cordate
    definition: Heart-shaped, with a notch (sinus) at the base.
    synonyms: [heart-shaped, heart shaped]
  - name: DELTOID
    label: Deltoid
    definition: Triangular, shaped like the Greek letter delta.
    synonyms: [triangular, delta-shaped]
  - name: ELLIPTIC
    label: Elliptic
    definition: Oval and widest at the middle, tapering equally to both ends.
    synonyms: [elliptical, oval-elliptic]
  - name: ENSIFORM
    label: Ensiform
    definition: Sword-shaped with a sharp point; flattened and tapering.
    synonyms: [sword-shaped, sword-like]
  - name: LYRATE
    label: Lyrate
    definition: Pinnately lobed with a large terminal lobe and smaller lower lobes (lyre-shaped).
    synonyms: [lyre-shaped]
  - name: OBCORDATE
    label: Obcordate
    definition: Inversely heart-shaped; heart-shaped with the notch at the apex.
    synonyms: [inversely heart-shaped]
    parents: [CORDATE]
  - name: FALCATE
    label: Falcate
    definition: Sickle-shaped; curved and flat.
    synonyms: [sickle-shaped, curved]
  - name: FLABELLATE
    label: Flabellate
    definition: Fan-shaped.
    synonyms: [fan-shaped]
  - name: OBDELTOID
    label: Obdeltoid
    definition: Inversely triangular; triangular with the point at the base.
    synonyms: [inversely triangular]
    parents: [DELTOID]
  - name: OBELLIPTIC
    label: Obelliptic
    definition: Inversely elliptic (broadest above the middle).
    synonyms: [inversely elliptic]
    parents: [ELLIPTIC]
  - name: OBLANCEOLATE
    label: Oblanceolate
    definition: Inversely lanceolate; broadest near the apex, tapering to the base.
    synonyms: [inversely lanceolate, oblanceolate]
  - name: OBLONG
    label: Oblong
    definition: Longer than wide with nearly parallel sides.
    synonyms: [oblong]
  - name: PERFOLIATE
    label: Perfoliate
    definition: Leaf base completely surrounds the stem so the stem appears to pass through it.
    synonyms: [perfoliate, stem-clasping through]
  - name: QUADRATE
    label: Quadrate
    definition: Square or nearly square in outline.
    synonyms: [square, squarish]
  - name: OBOVATE
    label: Obovate
    definition: Inversely ovate; egg-shaped with the broadest part above the middle.
    synonyms: [inversely ovate, obovate]
    parents: [OVATE]
  - name: ORBICULAR
    label: Orbicular
    definition: Circular or nearly circular in outline.
    synonyms: [circular, round, rounded, orbiculate]
  - name: RENIFORM
    label: Reniform
    definition: Kidney-shaped; broader than long with a basal notch.
    synonyms: [kidney-shaped, roundish-reniform]
  - name: RHOMBIC
    label: Rhombic
    definition: Diamond-shaped; widest at the middle with angled sides.
    synonyms: [diamond-shaped, rhomboid, rhomboidal]
  - name: OVAL
    label: Oval
    definition: Broadly elliptic; rounded at both ends, about twice as long as wide.
    synonyms: [oval]
    parents: [ELLIPTIC]
  - name: OVATE
    label: Ovate
    definition: Egg-shaped, with the broadest part below the middle.
    synonyms: [egg-shaped, ovate]
  - name: ROTUND
    label: Rotund
    definition: Rounded, nearly circular.
    synonyms: [rounded, roundish]
    parents: [ORBICULAR]
  - name: SAGITTATE
    label: Sagittate
    definition: Arrowhead-shaped, with two basal lobes pointing downward.
    synonyms: [arrowhead-shaped, arrow-shaped]
  - name: PANDURATE
    label: Pandurate
    definition: Fiddle-shaped; constricted in the middle.
    synonyms: [fiddle-shaped, panduriform]
  - name: PELTATE
    label: Peltate
    definition: Shield-shaped, with the petiole attached to the underside rather than the margin.
    synonyms: [shield-shaped]
  - name: SPATULATE
    label: Spatulate
    definition: Spoon-shaped; rounded at the apex and tapering to the base.
    synonyms: [spoon-shaped, spathulate]
  - name: SUBULATE
    label: Subulate
    definition: Awl-shaped; narrow and tapering to a fine point.
    synonyms: [awl-shaped, tapering to a point]
    parents: [AWL_SHAPED]
  - name: CUNEATE
    label: Cuneate
    definition: Wedge-shaped; triangular with the narrow end at the base.
    synonyms: [wedge-shaped]

  # Proposed terms — defined but not yet in active use; activate by changing
  # `status: proposed` to `status: active` when ready.
  - name: LANCEOLATE
    label: Lanceolate
    definition: Lance-shaped; much longer than wide and tapering to a point, widest below the middle.
    synonyms: [lance-shaped, lanceolate]
    status: proposed
    notes: Proposed term; not yet in active use.
  - name: LINEAR
    label: Linear
    definition: Long and narrow with parallel sides.
    synonyms: [linear, narrow]
    status: proposed
    notes: Proposed term; not yet in active use.
