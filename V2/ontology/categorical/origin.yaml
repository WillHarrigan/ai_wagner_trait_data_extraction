name: origin
multi: false
description: Biogeographic origin / status of the plant in Hawaii.
values:
  - name: ENDEMIC
    label: Endemic
    definition: Native and found only in Hawaii.
    synonyms: [endemic]
  - name: INDIGENOUS
    label: Indigenous
    definition: Native to Hawaii but also occurring naturally elsewhere.
    synonyms: [indigenous, native]
  - name: POLYNESIAN_INTRODUCTION
    label: Polynesian introduction
    definition: Brought to Hawaii by Polynesians before European contact.
    synonyms: [polynesian introduction, canoe plant]
  - name: NATURALIZED
    label: Naturalized
    definition: Introduced after European contact and now reproducing on its own.
    synonyms: [naturalized, naturalised]
