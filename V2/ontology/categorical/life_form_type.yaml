name: life_form_type
group: life_form
multi: true
# EDITS per expert email:
#   - VINE redefined as herbaceous; LIANA added as the woody counterpart.
#   - SUBSHRUB added.
#   - GRASS/SEDGE/MONOCOTS retained (appearance-based tags); see note. Expert says
#     these are technically herbs and woody bamboo may warrant its own category.
description: Growth habit or life form (annual herb, perennial herb, shrub, tree, vine, liana, etc.)
values:
  - name: ANNUAL_HERB
    label: Annual herb
    definition: A non-woody plant completing its life cycle within one year.
    synonyms: [annual herb, annual, annuals]
  - name: BIENNIAL_HERB
    label: Biennial herb
    definition: A non-woody plant completing its life cycle over two years.
    synonyms: [biennial herb, biennial]
  - name: PERENNIAL_HERB
    label: Perennial herb
    definition: A non-woody plant living for more than two years.
    synonyms: [perennial herb, perennial herbs, perennial, perrenial herb]
  - name: SUBSHRUB
    label: Subshrub
    definition: >
      A perennial plant that is woody at the base but has herbaceous or weakly
      woody upper stems that may die back seasonally.
    synonyms: [subshrub, suffrutescent, suffruticose, suffrutex]
  - name: SHRUB
    label: Shrub
    definition: A woody plant smaller than a tree, usually with several stems from the base.
    synonyms: [shrub, shrubs, bush]
  - name: TREE
    label: Tree
    definition: A large woody plant with a single main trunk.
    synonyms: [tree, trees]
  - name: SHRUB_TREE
    label: Shrub/Tree
    definition: A woody plant intermediate between shrub and tree, or described as either.
    synonyms: [shrub or tree, small tree, shrub/tree]
  - name: VINE
    label: Vine
    definition: >
      Herbaceous or weakly woody plant with elongate, non-self-supporting stems
      that climb, twine, trail, or scramble over other plants or substrate.
    synonyms: [vine, climber, climbing plant, scandent plant, scandent]
  - name: LIANA
    label: Liana
    definition: >
      Woody plant with elongate, non-self-supporting stems that climb, twine, or
      scramble over other plants or structural supports.
    synonyms: [liana, liane, woody vine, woody climber]
  - name: EPIPHYTE
    label: Epiphyte
    definition: A plant growing on another plant, not rooted in soil.
    synonyms: [epiphyte, epiphytic]
  - name: GRASS
    label: Grass
    definition: A member of the grass family (Poaceae) habit. Technically a herb (see note).
    synonyms: [grass, grasses, graminoid]
  - name: SEDGE
    label: Sedge
    definition: A grass-like plant of the sedge family (Cyperaceae) habit. Technically a herb.
    synonyms: [sedge, sedges]
  - name: MONOCOTS_NON_GRASS
    label: Monocots (non-grass)
    definition: A general monocotyledonous herbaceous habit where grass/sedge does not apply.
    synonyms: [monocots, monocot, monocotyledonous herb, monocots (non-grass)]
