name: life_form_type
group: life_form
multi: true
description: Growth habit or life form (annual herb, perennial herb, shrub, tree, vine, etc.)

values:
  - name: ANNUAL_HERB
    label: Annual herb
    definition: A non-woody plant completing its life cycle within one year.
    synonyms: [annual herb, annual, annuals]
  - name: BIENNIAL_HERB
    label: Biennial herb
    definition: A non-woody plant completing its life cycle over two years.
    synonyms: [biennial herb, biennial]
  - name: PERENNIAL_HERB
    label: Perennial herb
    definition: A non-woody plant living for more than two years.
    synonyms: [perennial herb, perennial herbs, perennial]
  - name: SHRUB
    label: Shrub
    definition: A woody plant smaller than a tree, usually with several stems from the base.
    synonyms: [shrub, shrubs, bush]
  - name: TREE
    label: Tree
    definition: A large woody plant with a single main trunk.
    synonyms: [tree, trees]
  - name: SHRUB_TREE
    label: Shrub/Tree
    definition: A woody plant intermediate between shrub and tree, or described as either.
    synonyms: [shrub or tree, small tree, shrub/tree]
  - name: VINE
    label: Vine
    definition: A climbing or trailing plant.
    synonyms: [vine, climber, liana, scandent]
  - name: EPIPHYTE
    label: Epiphyte
    definition: A plant growing on another plant, not rooted in soil.
    synonyms: [epiphyte, epiphytic]
  - name: GRASS
    label: Grass
    definition: A member of the grass family (Poaceae) habit.
    synonyms: [grass, grasses, graminoid]
  - name: SEDGE
    label: Sedge
    definition: A grass-like plant of the sedge family (Cyperaceae) habit.
    synonyms: [sedge, sedges]
  - name: MONOCOTS
    label: Monocots
    definition: A general monocotyledonous herbaceous habit, used where a more specific life form (grass, sedge, etc.) does not apply.
    synonyms: [monocots, monocot, monocotyledonous herb]
