name: stem_hair_type
multi: true
description: Surface hair (indumentum) type of the stem.
values:
  - name: GLABROUS
    label: Glabrous
    definition: Smooth; without hairs.
    synonyms: [glabrous, smooth, hairless]
  - name: DENDRITIC
    label: Dendritic
    definition: With branched, tree-like hairs.
    synonyms: [dendritic]
  - name: HIRSUTE
    label: Hirsute
    definition: With rather coarse, stiff hairs.
    synonyms: [hirsute]
  - name: HISPID
    label: Hispid
    definition: With stiff or bristly hairs.
    synonyms: [hispid]
  - name: LEPIDOTE
    label: Lepidote
    definition: Covered with small scurfy scales.
    synonyms: [lepidote, scurfy]
  - name: PILOSE
    label: Pilose
    definition: With soft, slender, spreading hairs.
    synonyms: [pilose]
  - name: PUBERULENT
    label: Puberulent
    definition: Minutely pubescent; with very short, fine hairs.
    synonyms: [puberulent]
  - name: STRIGOSE
    label: Strigose
    definition: With straight, stiff, appressed hairs.
    synonyms: [strigose]
  - name: STELLATE
    label: Stellate
    definition: With star-shaped (branched from a point) hairs.
    synonyms: [stellate, star-shaped hairs]
  - name: TOMENTOSE
    label: Tomentose
    definition: With dense, matted, woolly hairs.
    synonyms: [tomentose, woolly]
  - name: VILLOUS
    label: Villous
    definition: With long, soft, shaggy but not matted hairs.
    synonyms: [villous, villose]
  - name: GLAUCOUS
    label: Glaucous
    definition: Covered with a whitish or bluish waxy bloom.
    synonyms: [glaucous]
