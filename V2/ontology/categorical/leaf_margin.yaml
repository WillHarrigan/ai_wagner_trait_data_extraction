name: leaf_margin_type
group: leaf_morphology
multi: true
description: Type of leaf edge (entire, serrate, lobed, etc.)

values:
  - name: ENTIRE
    label: Entire
    definition: Margin smooth, without teeth, lobes, or indentations.
    synonyms: [smooth, untoothed, even]
  - name: TEETH
    label: Toothed
    definition: Margin bearing teeth (serrate, dentate, crenate, or incised).
    synonyms: [toothed, serrate, serrated, dentate, crenate, incised, denticulate]
  - name: NOTEETH
    label: No teeth
    definition: Margin lacking teeth (untoothed but not necessarily perfectly entire).
    synonyms: [no teeth, without teeth, toothless]
    parents: [ENTIRE]
  - name: LOBED
    label: Lobed
    definition: Margin with rounded or pointed projections (lobes) separated by sinuses.
    synonyms: [lobed, palmately lobed, pinnately lobed, cleft, dissected]
