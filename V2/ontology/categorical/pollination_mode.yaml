name: pollination_mode
group: reproductive_morphology
multi: true
# NEW (expert email): cleistogamous/chasmogamous moved OUT of breeding_type to here —
# they describe flower opening / pollination, not the monoecy/dioecy axis.
description: >
  Flower-opening / pollination mode. Cleistogamous flowers are assumed selfing;
  chasmogamous flowers are assumed outcrossing (neither exclusively).
values:
  - name: CLEISTOGAMOUS
    label: Cleistogamous
    definition: Self-pollinating within flowers that never open.
    synonyms: [cleistogamous, cleistogamy]
  - name: CHASMOGAMOUS
    label: Chasmogamous
    definition: Pollinating in flowers that open normally (the opposite of cleistogamous).
    synonyms: [chasmogamous, chasmogamy, chasomogamous]
