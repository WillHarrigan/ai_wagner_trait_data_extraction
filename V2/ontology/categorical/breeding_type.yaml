name: breeding_type
multi: true
# EDITS per expert email:
#   - ADDED: HERMAPHRODITIC, ANDRODIOECIOUS, SUBDIOECIOUS.
#   - CHASMOGAMOUS/CLEISTOGAMOUS REMOVED from here -> moved to pollination_mode
#     (they describe flower opening/pollination, not the monoecy/dioecy axis).
#   - TSV typos normalized (CHASOMOGAMOUS, POLYGAMO-MONECIOUS, etc.).
description: >
  Breeding system — the distribution of male, female, and bisexual flowers
  across the flowers of a plant and across plants of a population.
values:
  - name: HERMAPHRODITIC
    label: Hermaphroditic
    definition: All flowers on all plants with functional male and female parts.
    synonyms: [hermaphroditic, perfect, bisexual]
  - name: MONOECIOUS
    label: Monoecious
    definition: Separate male and female flowers borne on the same individual plant.
    synonyms: [monoecious]
  - name: DIOECIOUS
    label: Dioecious
    definition: Male and female flowers borne on separate individual plants.
    synonyms: [dioecious]
  - name: ANDROMONOECIOUS
    label: Andromonoecious
    definition: Bearing both bisexual and male (staminate) flowers on the same plant.
    synonyms: [andromonoecious]
    parents: [MONOECIOUS]
  - name: GYNOMONOECIOUS
    label: Gynomonoecious
    definition: Bearing both bisexual and female (pistillate) flowers on the same plant.
    synonyms: [gynomonoecious, gynomonecious]
    parents: [MONOECIOUS]
  - name: ANDRODIOECIOUS
    label: Androdioecious
    definition: Some plants bear only male flowers, others bear bisexual flowers.
    synonyms: [androdioecious]
    parents: [DIOECIOUS]
  - name: GYNODIOECIOUS
    label: Gynodioecious
    definition: Some plants bear only female flowers, others bear bisexual flowers.
    synonyms: [gynodioecious]
    parents: [DIOECIOUS]
  - name: SUBDIOECIOUS
    label: Subdioecious
    definition: >
      Mostly dioecious, but with some individuals bearing a small number of
      opposite-sex or bisexual flowers.
    synonyms: [subdioecious]
    parents: [DIOECIOUS]
  - name: POLYGAMOUS
    label: Polygamous
    definition: Bearing both bisexual and unisexual flowers on the same or different plants.
    synonyms: [polygamous]
  - name: POLYGAMO_MONOECIOUS
    label: Polygamo-monoecious
    definition: Bisexual and unisexual flowers borne on the same plant.
    synonyms: [polygamo-monoecious, polygamomonoecious, polygamo-monecious]
    parents: [POLYGAMOUS]
  - name: POLYGAMO_DIOECIOUS
    label: Polygamo-dioecious
    definition: Functionally dioecious but with some bisexual flowers present on each plant.
    synonyms: [polygamo-dioecious, polygamodioecious, polygamo-dioecoius]
    parents: [POLYGAMOUS]
  - name: STERILE
    label: Sterile
    definition: Plant or flowers not producing functional reproductive output.
    synonyms: [sterile, infertile]
