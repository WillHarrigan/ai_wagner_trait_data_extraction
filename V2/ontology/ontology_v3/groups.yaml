# Trait groups for ontology_v3. Membership is derived from each trait's own
# `group:`. NEW groups (per expert email) marked below.
groups:
  taxon_identity:
    description: Names of the organism and its major plant group (Dicots / Monocots / Conifers / Ferns).
  source_document:
    description: Provenance metadata — Wagner page number and plate references. Not biological traits.
  life_form:
    description: Habit (life-form) — general appearance or manner of growth.
  reproductive_morphology:
    description: >
      Reproductive biology — breeding system, pollination mode (cleistogamous/
      chasmogamous), mating system (selfing/outcrossing), and cytology.
  distribution:
    description: Where the plant occurs in Hawaii — island(s), origin, conservation status.

  root_morphology:                     # NEW (expert email: "Roots")
    description: The root system — root type/habit and root dimensions.

  stem_morphology:
    description: The above-ground axis — stem/plant height and stem pubescence.
  leaf_morphology:
    description: Whole-leaf morphology — structure, shape, margin, phyllotaxy, dimensions.
  leaf_indumentum:
    description: Pubescence (surface hair) on leaves — overall, upper, lower (and juvenile).
  leaflet_morphology:
    description: The ultimate unit of a compound leaf — leaflet structure, shape, margin, dimensions.
  juvenile_leaf_morphology:
    description: Leaves at the juvenile stage where they differ from adult leaves (heteroblasty).
  inflorescence_morphology:
    description: Arrangement of flowers on the axis — type and dimensions of supporting parts; heads, spadices.
  bract_involucre_morphology:
    description: Specialised leaves of the inflorescence — bracts, bracteoles, involucre.
  outer_flower_morphology:
    description: Outer floral envelope — calyx (incl. calyx_type), corolla, perianth, labellum.

  androecium_morphology:               # NEW (expert email: "Androecium")
    description: >
      The male organs collectively — stamens, anthers (attachment), filaments,
      pollen, staminodes/pseudostaminodes, and associated structures.
  gynoecium_morphology:                # NEW (expert email: "Gynoecium")
    description: >
      The female organs collectively — stigma, style, ovary, ovary position,
      placentation, ovules, and associated structures. Kept SEPARATE from fruit.

  fruit_morphology:
    description: >
      The ripened ovary and the seed(s) — fruit type/shape/surface, pericarp
      layers (exocarp/mesocarp/endocarp as parts), seed shape/surface, aril/hilum
      (as parts), and fruit/seed dimensions.
