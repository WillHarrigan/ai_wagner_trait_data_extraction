name: leaf_type
group: leaf_morphology
multi: false
description: Whether the leaf is simple or compound. Reused for juvenile and leaflet variants.
values:
  - name: SIMPLE
    label: Simple
    definition: A leaf with a single, undivided blade (though it may be lobed or cleft).
    synonyms: [simple]
  - name: COMPOUND
    label: Compound
    definition: A leaf divided into two or more distinct leaflets.
    synonyms: [compound]
