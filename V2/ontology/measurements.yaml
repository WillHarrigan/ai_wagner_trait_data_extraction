# Non-categorical fields (datatype: quantitative / text / list / path), each
# tagged with structure / sex / position so an agent can ask e.g. 'what fields
# do I record for the male calyx?'. Categorical traits live in categorical/.
# Hand-edit this file directly; the top-level key is kept as `measurements:`.

measurements:
  # --- taxon_identity ---
  infraspecific_epithet:
    group: taxon_identity
    kind: text
    description: "Infraspecific taxon name following the species name"
    structure: ~
    sex: neutral
    position: []
  common_name:
    group: taxon_identity
    kind: text
    description: "Common or vernacular name of the plant"
    structure: ~
    sex: neutral
    position: []
  hawaiian_name:
    group: taxon_identity
    kind: text
    description: "Hawaiian name of the plant, including diacritical marks"
    structure: ~
    sex: neutral
    position: []

  # --- source_document ---
  wagner_pg_number:
    group: source_document
    kind: text
    description: "Reference page number in Wagner's Manual of Flowering Plants of Hawaii"
    structure: ~
    sex: neutral
    position: []
  plate_references:
    group: source_document
    kind: list
    description: "Plate references for this species as they appear in the passage (e.g. 'Plate 7'). Case-insensitive; ignore markdown formatting like *Plate 7* or **plate 7**."
    structure: ~
    sex: neutral
    position: []

  # --- reproductive_morphology ---
  ploidy:
    group: reproductive_morphology
    kind: list
    description: "Ploidy level for the specific species expressed as a function of n (e.g., 1n, 2n or 3n, etc..)"
    structure: ploidy
    sex: neutral
    position: []
  chromosome_number:
    group: reproductive_morphology
    kind: list
    description: "Species specific chromosome count (integer number)"
    structure: chromosome
    sex: neutral
    position: []

  # --- stem_morphology ---
  stem_height:
    group: stem_morphology
    kind: measurement
    description: "Overall height of the plant or length of the main stem"
    structure: stem
    sex: neutral
    position: []

  # --- leaf_morphology ---
  leaf_dimensions:
    group: leaf_morphology
    kind: dimensions
    description: "Dimensions of leaves or individual leaf blade"
    structure: leaf
    sex: neutral
    position: []
  petiole_length:
    group: leaf_morphology
    kind: measurement
    description: "Length of leaf stalk (petiole)."
    structure: petiole
    sex: neutral
    position: []

  # --- leaflet_morphology ---
  leaflets_leaf_dimensions:
    group: leaflet_morphology
    kind: dimensions
    description: "Dimensions of individual leaflets"
    structure: leaflets_leaf
    sex: neutral
    position: []

  # --- juvenile_leaf_morphology ---
  juvenile_leaf_dimensions:
    group: juvenile_leaf_morphology
    kind: dimensions
    description: "Dimensions of juvenile leaves"
    structure: juvenile_leaf
    sex: neutral
    position: []

  # --- inflorescence_morphology ---
  inflorescence_dimensions:
